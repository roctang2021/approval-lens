# Bash matching rules. DSL reference: CONTRIBUTING.md.
# Guard conditions apply to each matching stage, including nested shell source.
# User-facing text lives in locales/<lang>.yaml under rules.<id>.
# Equal-severity matches retain file order, which can affect the headline.

rules:
  # destructive filesystem
  - id: rm-rf-risky-target
    category: destructive-fs
    severity: high
    predicate: rm_recursive_risky_target
    detail: rm_target

  - id: rm-rf-plain
    category: destructive-fs
    severity: medium
    predicate: rm_recursive_plain
    detail: rm_target

  - id: dd-to-device
    category: destructive-fs
    severity: high
    # Exclude pseudo-devices: writing /dev/null does not overwrite storage.
    regex: '\bdd\b[^|;&]*\bof=/dev/(?!null\b|zero\b|u?random\b|std(in|out|err)\b|tty|full\b)'
    detail: device
    verb: 'dd'

  - id: mkfs
    category: destructive-fs
    severity: high
    regex: '\bmkfs(\.\w+)?\b'
    detail: device
    verb: 'mkfs(\..+)?'

  - id: shred
    category: destructive-fs
    severity: medium
    regex: '\bshred\b'
    verb: 'shred'

  # Match device redirection without requiring a dd command.
  - id: redirect-to-device
    category: destructive-fs
    severity: high
    regex: '^/dev/(?!null$|zero$|u?random$|std(in|out|err)$|tty|full$|fd(/|$))'
    scope: redirect
    detail: device

  - id: chmod-chown-recursive
    category: destructive-fs
    severity: medium
    regex: '\bch(mod|own)\b[^|;&]*(\s-[a-zA-Z]*R[a-zA-Z]*|\s--recursive)\b'
    verb: 'ch(mod|own)'

  - id: chmod-world-writable
    category: destructive-fs
    severity: medium
    regex: '\bchmod\b[^|;&]*\b(777|a\+w|o\+w)\b'
    verb: 'chmod'

  # remote code execution
  - id: pipe-to-shell
    category: remote-exec
    severity: high
    scope: pipeline
    pipe_to: 'bash|sh|zsh|dash|ksh|fish'
    detail: url_host
    verb: 'curl|wget|fetch'

  - id: shell-from-process-sub
    category: remote-exec
    severity: high
    scope: process
    pipe_to: 'bash|sh|zsh|dash|ksh'
    detail: url_host
    verb: 'curl|wget|fetch'

  - id: curl-pipe-interpreter
    category: remote-exec
    severity: high
    scope: pipeline
    pipe_to: 'python[0-9.]*|perl|ruby|node|php'
    detail: url_host
    verb: 'curl|wget|fetch'

  # data exfiltration
  - id: curl-upload-file
    category: exfiltration
    severity: high
    regex: '\b(curl|wget)\b[^|;&]*(\s-d\s*@|--data(-binary|-raw|-urlencode)?\s*@|-F\s+\S*=@|\s-T\s+|--upload-file\b)'
    detail: url_host
    verb: 'curl|wget'

  - id: file-piped-to-network
    category: exfiltration
    severity: high
    # ssh is a network sink too: `tar czf - ~ | ssh host 'cat > home.tgz'`
    # ships the home directory exactly as `| curl -T -` would.
    scope: pipeline
    pipe_to: 'curl|wget|nc|ncat|netcat|socat|ssh'
    detail: url_host
    verb: 'cat|tar|zip|gzip|dd|head|tail'

  - id: netcat-outbound
    category: exfiltration
    severity: medium
    regex: '\b(nc|ncat|netcat)\b[^|;&]*<\s*\S'
    verb: 'nc|ncat|netcat'

  # Credential paths: use argument scope and exclude common display commands.
  - id: ssh-key-access
    category: credential-access
    severity: medium
    regex: '(/\.ssh/|\bid_rsa\b|\bid_ed25519\b|\bid_ecdsa\b)'
    scope: argv
    not_verb: 'echo|printf'

  - id: aws-creds-access
    category: credential-access
    severity: medium
    regex: '/\.aws/(credentials|config)\b|/\.aws\b'
    scope: argv
    not_verb: 'echo|printf'

  # Match the whole argument to reduce matches inside quoted prose.
  - id: dotenv-access
    category: credential-access
    severity: low
    regex: '(^|/)\.env(\.[\w.-]+)?$'
    scope: argv
    not_verb: 'echo|printf'

  # dump-keychain exports entries; -d exposes decrypted data. Lookup -w/-g
  # prints passwords, while a plain lookup returns metadata.
  - id: macos-keychain-dump
    category: credential-access
    severity: high
    regex: '\bsecurity\s+dump-keychain\b|\bsecurity\s+(find|dump)-(generic|internet)-password\b[^|;&]*(\s-[a-zA-Z]*[wg]\b)'
    verb: 'security'

  - id: macos-keychain-lookup
    category: credential-access
    severity: medium
    regex: '\bsecurity\s+(find|dump)-(generic|internet)-password\b(?![^|;&]*\s-[a-zA-Z]*[wg]\b)'
    verb: 'security'

  - id: linux-keyring-access
    category: credential-access
    severity: medium
    regex: '\b(secret-tool|gnome-keyring-daemon|kwalletcli)\b'
    verb: 'secret-tool|gnome-keyring-daemon|kwalletcli'

  # Paths that may contain saved logins, keys or configuration.
  - id: cred-file-access
    category: credential-access
    severity: medium
    regex: '(^|/)\.(netrc|npmrc|pypirc|git-credentials)$|(^|/)\.(kube|gnupg)/|(^|/)\.docker/config\.json$|(^|/)\.config/gh/hosts\.yml$'
    scope: argv
    not_verb: 'echo|printf'

  - id: shell-history-access
    category: credential-access
    severity: medium
    regex: '(\.bash_history|\.zsh_history|\.python_history|\.mysql_history|\.psql_history)$'
    scope: argv
    not_verb: 'echo|printf'

  # obfuscation
  - id: base64-decode-exec
    category: obfuscation
    severity: high
    scope: pipeline
    pipe_to: 'bash|sh|zsh|python[0-9.]*|perl|ruby|node'
    regex: '\bbase64\b[^|]*(-d|--decode|-D)\b'
    detail: url_host
    verb: 'base64'

  - id: hex-decode-exec
    category: obfuscation
    severity: high
    scope: pipeline
    pipe_to: 'bash|sh|zsh|python[0-9.]*'
    regex: '\b(xxd\s+-r|xxd\s+-p\s+-r|od\b.*|printf\b.*\\x)'
    detail: url_host
    verb: 'xxd|od|printf'

  - id: eval-dynamic
    category: obfuscation
    severity: medium
    regex: '\beval\s+\S'
    verb: 'eval'

  # privilege escalation
  - id: sudo
    category: privilege
    severity: medium
    regex: '(^|[\s;&|(])sudo\b'
    verb: 'sudo'

  - id: su-switch-user
    category: privilege
    severity: medium
    regex: '(^|[\s;&|(])su\s+[-\w]'
    verb: 'su'

  # Flag access to elevated capabilities, the host root or host PID namespace.
  - id: docker-privileged
    category: privilege
    severity: medium
    regex: '\bdocker\b[^;&|]*\brun\b[^;&|]*(--privileged\b|\s(-v|--volume)[=\s]+/:|--pid[=\s]+host\b)'
    verb: 'docker'

  # dangerous git
  - id: git-push-force
    category: git-dangerous
    severity: medium
    # `+refspec` is a force push spelled without the flag: `git push origin +main`.
    regex: '\bgit\b[^;&|]*\bpush\b[^;&|]*(--force(?!-with-lease)\b|\s-f\b|\s\+[^\s+-]\S*)'
    verb: 'git'

  - id: git-reset-hard
    category: git-dangerous
    severity: medium
    regex: '\bgit\b[^;&|]*\breset\b[^;&|]*--hard\b'
    verb: 'git'

  - id: git-clean-force
    category: git-dangerous
    severity: medium
    regex: '\bgit\b[^;&|]*\bclean\b[^;&|]*-[a-zA-Z]*f'
    verb: 'git'

  - id: git-remote-change
    category: git-dangerous
    severity: low
    regex: '\bgit\b[^;&|]*\bremote\b[^;&|]*\b(set-url|add)\b'
    verb: 'git'

  # publishing / irreversible
  - id: npm-publish
    category: publish-irreversible
    severity: medium
    regex: '\bnpm\s+publish\b'
    verb: 'npm'
    without_flags: ['--dry-run']

  - id: pypi-upload
    category: publish-irreversible
    severity: medium
    regex: '\btwine\s+upload\b|\bpython[0-9.]*\s+-m\s+twine\s+upload\b'
    verb: 'twine|python[0-9.]*'

  - id: iac-destroy
    category: publish-irreversible
    severity: high
    regex: '\b(terraform|terragrunt|pulumi|cdk)\s+destroy\b'
    verb: 'terraform|terragrunt|pulumi|cdk'

  - id: cloud-cli-delete
    category: publish-irreversible
    severity: medium
    regex: '\b(aws|gcloud|az)\b[^;&|]*\b(delete|rm|destroy|terminate|remove)\b'
    verb: 'aws|gcloud|az'
    # aws spells it --dryrun, gcloud/az --dry-run. Neither transfers anything.
    without_flags: ['--dryrun', '--dry-run']

  - id: k8s-delete
    category: publish-irreversible
    severity: medium
    regex: '\b(kubectl|helm)\b[^;&|]*\b(delete|uninstall)\b'
    verb: 'kubectl|helm'
    without_flags: ['--dry-run']

  - id: gh-repo-delete
    category: publish-irreversible
    severity: high
    regex: '\bgh\s+repo\s+delete\b'
    verb: 'gh'

  # persistence / system modification
  - id: crontab-modify
    category: persistence
    severity: medium
    regex: '\bcrontab\b(?!\s+-l)'
    verb: 'crontab'

  - id: systemd-service
    category: persistence
    severity: medium
    regex: '\bsystemctl\s+(enable|disable|start|stop|mask|unmask)\b'
    verb: 'systemctl'

  - id: launchd-modify
    category: persistence
    severity: medium
    regex: '\blaunchctl\s+(load|bootstrap|enable|submit)\b'
    verb: 'launchctl'

  # scope redirect, NOT not_verb: `echo 'payload' >> ~/.zshrc` is the canonical
  # dangerous form, so suppressing echo would delete the rule. What distinguishes
  # it from `echo "add this >> ~/.zshrc"` is whether the operator is really a
  # redirect or just text inside a quoted argument — a structural question.
  - id: shell-rc-append
    category: persistence
    severity: high
    regex: '(^|/)\.(bashrc|bash_profile|zshrc|zprofile|zshenv|profile)$'
    scope: redirect
