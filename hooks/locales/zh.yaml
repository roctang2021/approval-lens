# Permission Lens — 简体中文 locale (zh)
#
# Every user-visible string lives here. `en.yaml` is the base: any key missing
# from another locale falls back to the English one, so a partial translation
# degrades per-string instead of breaking.
#
# Sections:
#   rules        keyed by rule id (see hooks/rules*.yaml for the matching logic)
#                explanation = short jargon-free phrase (notifications, extra
#                              risks appended to a dialog reason)
#                risk        = ONE self-contained plain-language sentence: what
#                              the call does AND why it matters. This is the
#                              dialog headline; it must make sense alone, to a
#                              reader who won't look anything up. No shell
#                              jargon (pipe, process substitution, block
#                              device…) — name the consequence concretely.
#   ui           severity labels and the verbs used to build neutral summaries
#   verbs        "what this command does" phrases, keyed by command name
#   llm_prompts  Tier 2 system prompts (must instruct the model to answer in
#                this language, in plain words, 1-2 sentences, no markdown)
#   status       strings for scripts/lens-status.py

locale: zh
name: 简体中文
rules:
  rm-rf-risky-target:
    explanation: 按变量/通配符路径整棵删除目录
    risk: 这会按变量或通配符展开的路径整棵删除文件——一旦展开结果和预期不符，删掉的可能远超想象，而且不进废纸篓、无法找回。
  rm-rf-plain:
    explanation: 彻底删除目录及其全部内容
    risk: 这会把一个目录连同里面的所有内容彻底删除——不进废纸篓，也没有撤销。
  dd-to-device:
    explanation: 直接向磁盘写入原始数据
    risk: 这会把原始数据直接写到磁盘设备上——目标一旦写错，整块磁盘或分区就会被覆盖，无法恢复。
  mkfs:
    explanation: 格式化存储设备
    risk: 这会格式化一个存储设备——上面现有的所有数据都会被清空。
  shred:
    explanation: 抹除文件使其无法恢复
    risk: 这会反复覆写文件、专门让它无法恢复——即使用数据恢复工具也找不回来。
  chmod-chown-recursive:
    explanation: 批量修改整个目录树的权限
    risk: 这会一次性改变整个目录树下所有文件的访问权限——路径一旦指错，可能让你或系统一下子无法访问大量文件。
  chmod-world-writable:
    explanation: 把文件开放给所有用户修改
    risk: 这会让这台机器上的任何用户都能修改这些文件——之后凡是运行它们的程序，都可能已被人动过手脚。
  pipe-to-shell:
    explanation: 下载脚本并立即运行
    risk: 这会从网上下载脚本并立刻运行——你看不到代码内容，网站也可能在被审查之后换成另一份。
  shell-from-process-sub:
    explanation: 把刚下载的代码直接运行
    risk: 这会把刚从网上取回的代码直接运行——没有任何机会先读一眼里面是什么。
  curl-pipe-interpreter:
    explanation: 下载代码交给解释器直接运行
    risk: 这会下载代码并直接交给 Python/Node 等运行——还没等任何人检查内容就已经执行了。
  curl-upload-file:
    explanation: 把本地文件上传到服务器
    risk: 这会把本机的一个文件发送到远程服务器——如果里面有密钥或隐私数据，它们就此离开你的电脑。
  file-piped-to-network:
    explanation: 把文件内容通过网络发出
    risk: 这会把本地文件的内容通过网络发出去——数据（包括机密）悄悄离开本机的典型手法。
  netcat-outbound:
    explanation: 通过原始连接发送文件
    risk: 这会通过一条原始网络连接把本地文件发出去——不加密、无日志，直接离开本机。
  ssh-key-access:
    explanation: 访问你的 SSH 登录密钥
    risk: 这会碰到你的 SSH 密钥——拿到密钥的人就能以你的身份登录你的服务器，留意命令把它拷去或发往了哪里。
  aws-creds-access:
    explanation: 读取你的 AWS 云凭据
    risk: 这会读取你的 AWS 凭据——拿到它就能动用你的云资源、产生费用，留意它最终被送去了哪里。
  dotenv-access:
    explanation: 读取 .env 机密文件
    risk: 这会读取 .env 文件，里面通常存着 API 密钥和密码——值得看一眼命令把读到的内容送去了哪里。
  macos-keychain-dump:
    explanation: 从钥匙串提取已存密码
    risk: 这会把你 Mac 钥匙串里保存的密码以明文取出来——存在里面的凭据都可能被拷走。
  macos-keychain-lookup:
    explanation: "查询钥匙串中的单个条目"
    risk: "这会在你的 Mac 钥匙串里查一个指定的条目——单看这条命令返回的是条目信息而不是密码本身，但它能确认这个条目存在、属于哪个账户。"
  linux-keyring-access:
    explanation: 读取 keyring 中已存密码
    risk: 这会读取桌面 keyring 里保存的密码——存在里面的凭据可能被拷走。
  shell-history-access:
    explanation: 读取你的命令历史
    risk: 这会读取你的命令历史——里面常留着你以前敲过的密码、令牌和服务器地址。
  base64-decode-exec:
    explanation: 运行藏在 base64 里的代码
    risk: 这会把一段用 base64 编码隐藏的文本解码后当代码运行——编码的作用恰恰是让你看不出到底要运行什么。
  hex-decode-exec:
    explanation: 运行藏在十六进制里的代码
    risk: 这会把一段十六进制隐藏的文本解码后当代码运行——光看命令根本看不出实际会运行什么。
  eval-dynamic:
    explanation: 执行动态拼出的命令
    risk: 这会在运行时拼出一段文本再当命令执行——你现在看到的并不是实际会运行的那条命令。
  sudo:
    explanation: 以管理员权限运行
    risk: 这会以管理员（root）权限运行——出错时影响的不只是你的文件，而是整个系统。
  su-switch-user:
    explanation: 切换到另一个用户账户
    risk: 这会切换到另一个账户（通常是 root）——之后的操作都以那个账户的身份进行，而不是你。
  git-push-force:
    explanation: 覆盖远程 git 历史
    risk: 这会覆盖远程仓库的历史——别人推上去的提交可能就此永久丢失。
  git-reset-hard:
    explanation: 丢弃所有未提交的改动
    risk: 这会丢掉你所有未提交的改动——还没 commit 的工作直接消失，找不回来。
  git-clean-force:
    explanation: 删除未被 git 跟踪的文件
    risk: 这会删除 git 没在跟踪的文件——常是只存在本机的笔记和配置，删了就没有第二份。
  git-remote-change:
    explanation: 更改仓库推送目标
    risk: 这会更改仓库推送的目标服务器——之后的推送可能悄悄流向另一个（甚至恶意的）地址。
  npm-publish:
    explanation: 向 npm 公开发布包
    risk: 这会把包发布到 npm、对全世界公开——版本一旦发出去，实际上就收不回来了。
  pypi-upload:
    explanation: 向 PyPI 公开发布包
    risk: 这会把包发布到 PyPI——发布即公开，而且同一版本号永远不能重传。
  iac-destroy:
    explanation: 拆除线上云基础设施
    risk: 这会拆除线上的云基础设施（包括数据库）——拆掉的东西通常再也回不来。
  cloud-cli-delete:
    explanation: 删除云上资源
    risk: 这会删除你云账户里的资源——云上的删除往往无法撤销，还可能连带删掉数据。
  crontab-modify:
    explanation: 设置定时自动运行的命令
    risk: 这会设置按时自动运行的命令——这个会话结束以后，它们还会一直在后台定期运行。
  systemd-service:
    explanation: 更改系统后台服务
    risk: 这会更改一个系统后台服务——被启用的服务每次开机都会自动运行，不会再询问。
  launchd-modify:
    explanation: 注册开机自启程序
    risk: 这会把一个程序注册为登录/开机自动启动——从此它会一直自动运行，不再询问你。
  shell-rc-append:
    explanation: 往 shell 启动文件里加代码
    risk: 这会往你的 shell 启动文件里加代码——以后每开一个终端都会执行一遍，是藏后门的常用位置。
  web-userinfo:
    explanation: URL 里带着账号密码
    risk: 这个 URL 里直接写着账号和密码——请求沿途经过的日志和历史记录都会留下它们，很容易泄露。
  web-secret-in-query:
    explanation: URL 参数里带着机密
    risk: 这个 URL 的参数里带着密钥/令牌/密码——服务器和代理都会记录 URL，机密会被沿途留档。
  web-ip-or-localhost:
    explanation: 访问裸 IP 或你自己的机器
    risk: 这是在访问一个裸 IP 地址或你自己的电脑，而不是正常网站——常见于探测你本机或内网的行为。
  web-script-host:
    explanation: 从脚本托管/短链站点取内容
    risk: 这是在从脚本托管站或短链服务取内容——拿回来的到底是什么，值得先看一眼再用。
  path-ssh:
    explanation: 写入你的 SSH 密钥目录
    risk: 这是在写你的 ~/.ssh 目录——你登录服务器的密钥都在这里，改动可能把访问权交出去或者改道。
  path-aws:
    explanation: 写入你的 AWS 凭据目录
    risk: 这是在写你的 ~/.aws 目录——云访问密钥都在这里，改动可能把你云账户的控制权交出去。
  path-dotenv:
    explanation: 写入 .env 机密文件
    risk: 这是在写 .env 文件——里面通常放着 API 密钥和密码，值得逐行看清到底写入了什么。
  path-shell-rc:
    explanation: 写入 shell 启动文件
    risk: 这是在写你的 shell 启动文件——写进去的内容，以后每开一个终端都会执行一遍。
  path-git-hooks:
    explanation: 写入自动运行的 git 钩子
    risk: 这是在写 git 钩子——从此每次 commit/push 它都会以你的权限自动运行。
  path-ci-workflow:
    explanation: 写入 CI 工作流文件
    risk: 这是在写 CI 工作流——下次 push 就会运行，而且能接触仓库里保存的机密。
  path-launch-agent:
    explanation: 写入 macOS 自启动项
    risk: 这是在写 macOS 的自启动项——它指向的程序，以后每次登录/开机都会自己启动。
  path-cron:
    explanation: 写入定时任务
    risk: 这是在写定时任务——里面的命令从此会在无人值守时按时自动运行。
  path-sudoers:
    explanation: 写入管理员权限配置文件
    risk: 这是在写 sudoers 文件——它决定谁能拿到这台机器的管理员权限，改动可能永久授予 root 权限。
  path-etc:
    explanation: 写入系统级配置（/etc）
    risk: 这是在写 /etc 系统配置区——那里的改动会影响这台机器上的所有用户和程序。
  content-remote-exec:
    explanation: 写入内容含下载即执行
    risk: 写入的内容里含有下载即执行（或 eval）的命令——这个文件将来一旦被运行，就会从网上拉代码直接执行，没人审查。
ui:
  ai_wrap: "（AI 解读：{}）"
  severity_high: 高危
  severity_medium: 中危
  severity_low: 低危
  fallback_summary: 运行一条 shell 命令
  runs: 运行
  fetches: 访问
  writes: 写入
  edits: 编辑
verbs:
  ls: 列出目录内容
  cat: 输出文件内容
  cd: 切换工作目录
  cp: 复制文件
  mv: 移动或重命名文件
  mkdir: 创建目录
  touch: 创建文件或更新时间戳
  echo: 输出文本
  grep: 搜索文本
  rg: 搜索文本(ripgrep)
  find: 搜索文件系统
  sed: 编辑文本流
  awk: 处理文本
  python: 运行 Python 程序
  python3: 运行 Python 程序
  node: 运行 Node.js 程序
  make: 运行 make 目标
  brew: 运行 Homebrew 命令
  docker: 运行 Docker 命令
  kubectl: 运行 kubectl 命令
llm_prompts:
  bash: 你负责描述权限弹框里出现的一条 shell 命令。用户消息就是那条命令本身。这类操作有多危险,已经由一套规则引擎告诉读者了——不要重复,也不要重新评判。你要补的是规则给不出的那部分:这一条命令具体在做什么。用 1-2 句简短的中文大白话回答,点出涉及的具体对象(哪个主机、哪个文件或路径、哪个参数会改变结果)。不要评判危险程度,不要说它安全或危险,也不要建议批准或拒绝。少用术语。不要用 Markdown,不要客套开场白,不要代码块。
  url: 你负责描述权限弹框里的一次网络抓取。用户消息就是即将被抓取的那个 URL。这类抓取有多危险,已经由一套规则引擎告诉读者了——不要重复,也不要重新评判。你要补的是规则给不出的那部分:这一个 URL 具体是什么。用 1-2 句简短的中文回答,点出主机是谁、看起来提供什么,以及 URL 里的具体内容(路径、查询参数、内嵌的凭据)。不要评判危险程度,不要说它安全,也不要建议批准或拒绝。不要用 Markdown,不要客套。
  path: 你负责描述权限弹框里的一次文件写入或编辑。用户消息是目标文件路径,后面可能空一行再附上新内容。写入这类位置有多危险,已经由一套规则引擎告诉读者了——不要重复,也不要重新评判。你要补的是规则给不出的那部分:这一个文件具体是什么、这次改动做了什么。用 1-2 句简短的中文回答。不要评判危险程度,不要说它安全,也不要建议批准或拒绝。不要用 Markdown,不要客套。
status:
  tier2_never: "还没有高危调用走到这一步"
  tier2: "Tier 2:{state}"
  tier2_off: "未启用"
  tier2_skipped: "已跳过(主体过长)"
  tier2_cached: "命中缓存"
  tier2_no_credential: "hook 拿不到凭据"
  tier2_empty: "无回复(超时或 API 出错)"
  tier2_ok: "正常"
  tier2_error: "内部错误"
  none: 无命中
  asked: 已弹框
  silent: 未弹框
  last: 最近一次检查 {age}（{tool} · {what}）
  today: 今日已检查 {total} 次 · 🔴 {high} · 🟡 {medium} · 🟢 {low} · 无命中 {none} · 弹框 {asked}
  empty: 还没有任何调用记录——先在装了插件的会话里跑一条 Bash/WebFetch/Write/Edit（心跳文件:{path}）
  stale_day: (计数属于 {day},不是今天)
  s: '{n} 秒前'
  m: '{n} 分钟前'
  h: '{n} 小时前'
  d: '{n} 天前'
