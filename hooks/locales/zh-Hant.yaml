# Permission Lens — 繁體中文 locale (zh-Hant)
#
# Machine-localized from the Simplified Chinese file (zh.yaml) into Taiwan-
# oriented Traditional Chinese. Native-speaker review and corrections are
# very welcome.
#
# Every user-visible string lives here. `en.yaml` is the base: any key missing
# from another locale falls back to the English one, so a partial translation
# degrades per-string instead of breaking.
#
# Sections:
#   rules        keyed by rule id (see hooks/rules*.yaml for the matching logic)
#                explanation = short jargon-free phrase (notifications, extra
#                              risks appended to a dialog reason)
#                risk        = ONE self-contained plain-language sentence: what
#                              the call does AND why it matters. This is the
#                              dialog headline; it must make sense alone, to a
#                              reader who won't look anything up. No shell
#                              jargon (pipe, process substitution, block
#                              device…) — name the consequence concretely.
#   ui           severity labels and the verbs used to build neutral summaries
#   verbs        "what this command does" phrases, keyed by command name
#   llm_prompts  Tier 2 system prompts (must instruct the model to answer in
#                this language, in plain words, 1-2 sentences, no markdown)
#   status       strings for scripts/lens-status.py

locale: zh-Hant
name: 繁體中文
rules:
  rm-rf-risky-target:
    explanation: 依變數或萬用字元路徑整棵刪除目錄
    risk: 這會把變數或萬用字元展開出來的路徑整棵刪光——一旦展開結果和預期不符，刪掉的東西可能遠超想像，而且不會進垃圾桶，也救不回來。
  rm-rf-plain:
    explanation: 徹底刪除資料夾及其全部內容
    risk: 這會把一個資料夾連同裡面的所有東西徹底刪除——不會進垃圾桶，也沒辦法復原。
  dd-to-device:
    explanation: 直接把原始資料寫進磁碟
    risk: 這會把原始資料直接寫到磁碟裝置上——目標一旦指錯，整顆磁碟或分割區就會被覆蓋，再也救不回來。
  mkfs:
    explanation: 格式化儲存裝置
    risk: 這會格式化一個儲存裝置——上面現有的所有資料都會被清空。
  shred:
    explanation: 抹除檔案使其無法救回
    risk: 這會反覆覆寫檔案、專門讓它無法救回——就算用資料救援工具也找不回來。
  chmod-chown-recursive:
    explanation: 整棵目錄樹批次修改權限
    risk: 這會一次改掉整棵目錄樹底下所有檔案的存取權限——路徑一旦指錯，可能讓你或系統一下子無法存取大量檔案。
  chmod-world-writable:
    explanation: 開放給所有使用者修改檔案
    risk: 這會讓這台機器上的任何使用者都能修改這些檔案——之後凡是執行到它們的程式，都可能已經被人動過手腳。
  pipe-to-shell:
    explanation: 下載指令碼後立刻執行
    risk: 這會從網路下載一段指令碼並立刻執行——你看不到裡面的程式碼，網站也可能在別人看過之後換成另一份。
  shell-from-process-sub:
    explanation: 把剛下載的程式碼直接執行
    risk: 這會把剛從網路取回的程式碼直接執行，沒有任何機會先看一眼裡面是什麼。
  curl-pipe-interpreter:
    explanation: 下載程式碼交給直譯器執行
    risk: 這會下載程式碼並直接交給 Python/Node 等執行——還沒等任何人檢查內容就已經跑起來了。
  curl-upload-file:
    explanation: 把本機檔案上傳到伺服器
    risk: 這會把本機的一個檔案送到遠端伺服器——如果裡面有金鑰或私密資料，它們就此離開你的電腦。
  file-piped-to-network:
    explanation: 把檔案內容透過網路送出
    risk: 這會把本機檔案的內容透過網路送出去——資料（包含機密）悄悄離開這台電腦的典型手法。
  netcat-outbound:
    explanation: 透過原始連線送出檔案
    risk: 這會透過一條原始網路連線把本機檔案送出去——不加密、不留紀錄，直接離開這台電腦。
  ssh-key-access:
    explanation: 動到你的 SSH 登入金鑰
    risk: 這會動到你的 SSH 金鑰——拿到金鑰的人就能用你的身分登入你的伺服器，留意這道指令把它複製到或送去了哪裡。
  aws-creds-access:
    explanation: 讀取你的 AWS 雲端憑證
    risk: 這會讀取你的 AWS 憑證——拿到它就能操控你的雲端資源、燒掉你的帳單，留意它最後被送去了哪裡。
  dotenv-access:
    explanation: 讀取 .env 機密檔
    risk: 這會讀取 .env 檔案，裡面通常放著 API 金鑰和密碼——值得看一眼這道指令把讀到的內容送去了哪裡。
  macos-keychain-dump:
    explanation: 從鑰匙圈取出已存密碼
    risk: 這會把你 Mac 鑰匙圈裡存的密碼以明文取出來——存在裡面的憑證通通可能被複製走。
  macos-keychain-lookup:
    explanation: "查詢鑰匙圈中的單一項目"
    risk: "這會在你的 Mac 鑰匙圈裡查詢一個指定的項目——單看這條指令回傳的是項目資訊而不是密碼本身，但它能確認這個項目存在、屬於哪個帳戶。"
  linux-keyring-access:
    explanation: 讀取 keyring 裡已存的密碼
    risk: 這會讀取桌面 keyring 裡存的密碼——存在裡面的憑證可能被複製走。
  shell-history-access:
    explanation: 讀取你的指令歷史
    risk: 這會讀取你的指令歷史——裡面常留著你以前打過的密碼、權杖和伺服器位址。
  base64-decode-exec:
    explanation: 執行藏在 base64 裡的程式碼
    risk: 這會把一段用 base64 編碼藏起來的文字解碼後當程式碼執行——編碼的用意正是讓你看不出到底要跑什麼。
  hex-decode-exec:
    explanation: 執行藏在十六進位裡的程式碼
    risk: 這會把一段十六進位藏起來的文字解碼後當程式碼執行——光看這道指令根本看不出實際會跑什麼。
  eval-dynamic:
    explanation: 執行動態組出來的指令
    risk: 這會在執行當下組出一段文字再當指令執行——你現在看到的並不是實際會跑的那道指令。
  sudo:
    explanation: 以管理員權限執行
    risk: 這會以管理員（root）權限執行——出錯時影響的不只是你的檔案，而是整個系統。
  su-switch-user:
    explanation: 切換到另一個使用者帳戶
    risk: 這會切換到另一個帳戶（通常是 root）——之後的動作都以那個帳戶的身分進行，而不是你。
  git-push-force:
    explanation: 覆蓋遠端 git 歷史
    risk: 這會覆蓋遠端儲存庫的歷史——別人推上去的 commit 可能就此永久消失。
  git-reset-hard:
    explanation: 丟棄所有未提交的改動
    risk: 這會丟掉你所有還沒提交的改動——尚未 commit 的成果直接消失，救不回來。
  git-clean-force:
    explanation: 刪除未被 git 追蹤的檔案
    risk: 這會刪掉 git 沒在追蹤的檔案——常常是只存在這台電腦上的筆記和設定，刪了就沒有第二份。
  git-remote-change:
    explanation: 更改儲存庫的推送目標
    risk: 這會更改儲存庫要推送到哪一台伺服器——之後的推送可能悄悄流向另一個（甚至是惡意的）位置。
  npm-publish:
    explanation: 把套件公開發布到 npm
    risk: 這會把套件發布到 npm、對全世界公開——版本一旦送出去，實際上就收不回來了。
  pypi-upload:
    explanation: 把套件公開發布到 PyPI
    risk: 這會把套件發布到 PyPI——發布即公開，而且同一個版本號永遠不能重傳。
  iac-destroy:
    explanation: 拆掉線上的雲端基礎架構
    risk: 這會拆掉線上的雲端基礎架構（包含資料庫）——拆掉的東西通常再也回不來。
  cloud-cli-delete:
    explanation: 刪除雲端資源
    risk: 這會刪除你雲端帳戶裡的資源——雲端上的刪除往往無法復原，還可能連帶把資料一起帶走。
  crontab-modify:
    explanation: 設定會定時自動執行的指令
    risk: 這會設定按時自動執行的指令——這次工作階段結束之後，它們還會一直在背景定期跑下去。
  systemd-service:
    explanation: 更改系統背景服務
    risk: 這會更改一個系統背景服務——被啟用的服務每次開機都會自己跑起來，不會再問你一次。
  launchd-modify:
    explanation: 註冊開機自動啟動的程式
    risk: 這會把一個程式註冊成登入或開機時自動啟動——從此它會一直自己跑，不再問你。
  shell-rc-append:
    explanation: 在 shell 啟動檔裡加程式碼
    risk: 這會在你的 shell 啟動檔裡加上程式碼——以後每開一個終端機都會執行一次，是藏東西的常見位置。
  web-userinfo:
    explanation: URL 裡帶著帳號密碼
    risk: 這個 URL 裡直接寫著帳號和密碼——請求沿途經過的日誌和瀏覽紀錄都會留下它們，很容易外洩。
  web-secret-in-query:
    explanation: URL 參數裡帶著機密
    risk: 這個 URL 的參數裡帶著金鑰、權杖或密碼——伺服器和代理都會記錄 URL，機密會沿路被留檔。
  web-ip-or-localhost:
    explanation: 連向裸 IP 或你自己的機器
    risk: 這是在連一個裸 IP 位址或你自己的電腦，而不是一般網站——常見於探測你本機或內部網路的行為。
  web-script-host:
    explanation: 從指令碼代管或短網址站台取內容
    risk: 這是在從指令碼代管站或短網址服務取內容——拿回來的到底是什麼，值得先看一眼再用。
  path-ssh:
    explanation: 寫入你的 SSH 金鑰資料夾
    risk: 這是在寫你的 ~/.ssh 資料夾——你登入伺服器的金鑰都放在這裡，改動可能把存取權交出去或改到別的地方。
  path-aws:
    explanation: 寫入你的 AWS 憑證資料夾
    risk: 這是在寫你的 ~/.aws 資料夾——雲端存取金鑰都放在這裡，改動可能把你雲端帳戶的控制權交出去。
  path-dotenv:
    explanation: 寫入 .env 機密檔
    risk: 這是在寫 .env 檔案——裡面通常放著 API 金鑰和密碼，值得逐行看清楚到底寫了什麼進去。
  path-shell-rc:
    explanation: 寫入 shell 啟動檔
    risk: 這是在寫你的 shell 啟動檔——寫進去的內容，以後每開一個終端機都會執行一次。
  path-git-hooks:
    explanation: 寫入會自動執行的 git hook
    risk: 這是在寫 git hook——從此每次 commit 或 push，它都會以你的權限自己執行。
  path-ci-workflow:
    explanation: 寫入 CI 工作流程檔
    risk: 這是在寫 CI 工作流程——下次 push 就會執行，而且碰得到儲存庫裡存的機密。
  path-launch-agent:
    explanation: 寫入 macOS 自動啟動項目
    risk: 這是在寫 macOS 的自動啟動項目——它指到的程式，以後每次登入或開機都會自己啟動。
  path-cron:
    explanation: 寫入排程工作
    risk: 這是在寫排程工作——裡面的指令從此會在無人看顧的情況下按時自動執行。
  path-sudoers:
    explanation: 寫入管理員權限設定檔
    risk: 這是在寫 sudoers 檔案——它決定誰能拿到這台機器的管理員權限，改動可能永久授予 root 權限。
  path-etc:
    explanation: 寫入系統層級設定（/etc）
    risk: 這是在寫 /etc 系統設定區——那裡的改動會影響這台機器上的所有使用者和程式。
  content-remote-exec:
    explanation: 寫入的內容含下載即執行
    risk: 要寫入的內容裡含有下載即執行（或 eval）的指令——這個檔案將來一旦被執行，就會從網路拉程式碼直接跑，沒有人審查過。
ui:
  ai_wrap: "（AI 解讀：{}）"
  severity_high: 高風險
  severity_medium: 中風險
  severity_low: 低風險
  fallback_summary: 執行一條 shell 指令
  runs: 執行
  fetches: 抓取
  writes: 寫入
  edits: 編輯
verbs:
  ls: 列出目錄內容
  cat: 輸出檔案內容
  cd: 切換工作目錄
  cp: 複製檔案
  mv: 移動或重新命名檔案
  mkdir: 建立目錄
  touch: 建立檔案或更新時間戳記
  echo: 輸出文字
  grep: 搜尋文字
  rg: 搜尋文字（ripgrep）
  find: 搜尋檔案系統
  sed: 編輯文字串流
  awk: 處理文字
  python: 執行 Python 程式
  python3: 執行 Python 程式
  node: 執行 Node.js 程式
  make: 執行 make 目標
  brew: 執行 Homebrew 指令
  docker: 執行 Docker 指令
  kubectl: 執行 kubectl 指令
llm_prompts:
  bash: 你負責描述權限跳窗裡出現的一條 shell 指令。使用者訊息就是那條指令本身。這類操作有多危險,已經由一套規則引擎告訴讀者了——不要重複,也不要重新評判。你要補的是規則給不出的那部分:這一條指令具體在做什麼。用 1-2 句簡短的繁體中文白話回答,點出涉及的具體對象(哪個伺服器、哪個檔案或路徑、某個參數被設成了什麼值)。如果從指令本身就看得出目標並不存在——編造的主機名、佔位路徑、不存在的遠端/使用者/儲存桶——直接說出來,這會改變讀者實際在決定的事。不要逐個解釋命令列開關的含義,除非你確定:把一個開關的作用說錯,比什麼都不說更誤導人。不要評判危險程度,不要說它安全或危險,也不要建議核准或拒絕。少用術語。不要用 Markdown,不要客套開場白,不要程式碼區塊。
  url: 你負責描述權限跳窗裡的一次網路抓取。使用者訊息就是即將被抓取的那個 URL。這類抓取有多危險,已經由一套規則引擎告訴讀者了——不要重複,也不要重新評判。你要補的是規則給不出的那部分:這一個 URL 具體是什麼。用 1-2 句簡短的繁體中文回答,點出主機是誰、看起來提供什麼,以及 URL 裡的具體內容(路徑、查詢參數、內嵌的憑證)。不要評判危險程度,不要說它安全,也不要建議核准或拒絕。不要用 Markdown,不要客套。
  path: 你負責描述權限跳窗裡的一次檔案寫入或編輯。使用者訊息是目標檔案路徑,後面可能空一行再附上新內容。寫入這類位置有多危險,已經由一套規則引擎告訴讀者了——不要重複,也不要重新評判。你要補的是規則給不出的那部分:這一個檔案具體是什麼、這次改動做了什麼。用 1-2 句簡短的繁體中文回答。不要評判危險程度,不要說它安全,也不要建議核准或拒絕。不要用 Markdown,不要客套。
status:
  none: 未命中
  asked: 已跳窗
  silent: 未跳窗
  last: 最近一次檢查 {age}（{tool} · {what}）
  today: 今日已檢查 {total} 次 · 🔴 {high} · 🟡 {medium} · 🟢 {low} · 未命中 {none} · 跳窗 {asked}
  empty: 還沒有任何呼叫紀錄——請先在已啟用外掛的工作階段裡執行一次 Bash/WebFetch/Write/Edit（心跳檔：{path}）
  stale_day: （計數屬於 {day}，不是今天）
  s: '{n} 秒前'
  m: '{n} 分鐘前'
  h: '{n} 小時前'
  d: '{n} 天前'
