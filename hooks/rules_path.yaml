# Permission Lens — Tier 1 rule data for the Write and Edit tools.
#
# Same rule shape as rules.yaml. `field` selects what the regex matches:
#   path    (default) — the target file_path (normalized: ~ expanded)
#   content           — the written content (Write) or new_string (Edit)
# Path patterns use substring anchors like `(^|/)` so they match whether the
# path is absolute (/Users/x/.ssh/id_rsa) or ~-relative (.ssh/id_rsa).

rules:
  # ── credential / secret files ─────────────────────────────────────────────
  - id: path-ssh
    category: credential-access
    severity: high
    regex: "(^|/)\\.ssh/"
    explanation_en: "Writes into your ~/.ssh directory"
    explanation_zh: "写入你的 ~/.ssh 目录"
    risk_en: "SSH keys and config live here; a change can grant or redirect remote access."
    risk_zh: "SSH 密钥和配置都在这里,改动可能授予或改变远程访问权限。"

  - id: path-aws
    category: credential-access
    severity: high
    regex: "(^|/)\\.aws/"
    explanation_en: "Writes into your ~/.aws credentials directory"
    explanation_zh: "写入你的 ~/.aws 凭据目录"
    risk_en: "Holds AWS access keys and profiles — a change can hand over cloud credentials."
    risk_zh: "存放 AWS 访问密钥与 profile —— 改动可能交出云凭据。"

  - id: path-dotenv
    category: credential-access
    severity: medium
    regex: "(^|/)\\.env(\\.[\\w.-]+)?$"
    explanation_en: "Writes a .env environment file"
    explanation_zh: "写入 .env 环境变量文件"
    risk_en: ".env files usually hold API keys and secrets — verify what is being written."
    risk_zh: ".env 文件通常存放 API 密钥和机密 —— 请确认写入了什么。"

  # ── persistence / auto-run ────────────────────────────────────────────────
  - id: path-shell-rc
    category: persistence
    severity: medium
    regex: "(^|/)\\.(bash_profile|bashrc|zshrc|zprofile|zshenv|profile)$"
    explanation_en: "Writes a shell startup file (.zshrc/.bashrc/…)"
    explanation_zh: "写入 shell 启动文件(.zshrc/.bashrc/…)"
    risk_en: "This runs on every new shell — a good hiding spot for a persistent command."
    risk_zh: "每开一个新 shell 都会执行 —— 是藏持久化命令的好地方。"

  - id: path-git-hooks
    category: persistence
    severity: high
    regex: "(^|/)\\.git/hooks/"
    explanation_en: "Writes a git hook"
    explanation_zh: "写入 git 钩子"
    risk_en: "Git hooks execute automatically on commit/push/checkout, with your privileges."
    risk_zh: "git 钩子会在 commit/push/checkout 时以你的权限自动执行。"

  - id: path-ci-workflow
    category: persistence
    severity: medium
    regex: "(^|/)\\.github/workflows/"
    explanation_en: "Writes a GitHub Actions workflow"
    explanation_zh: "写入 GitHub Actions 工作流"
    risk_en: "CI workflows run on push and can access repo secrets — review the change."
    risk_zh: "CI 工作流会在 push 时运行、可访问仓库机密 —— 请审查改动。"

  - id: path-launch-agent
    category: persistence
    severity: high
    regex: "(^|/)Library/Launch(Agents|Daemons)/"
    explanation_en: "Writes a macOS LaunchAgent/LaunchDaemon"
    explanation_zh: "写入 macOS LaunchAgent/LaunchDaemon"
    risk_en: "These start programs automatically at login/boot — a classic persistence mechanism."
    risk_zh: "它们会在登录/开机时自动启动程序 —— 典型的持久化手段。"

  - id: path-cron
    category: persistence
    severity: medium
    regex: "(^|/)(crontab$|cron\\.d/|etc/cron)"
    explanation_en: "Writes a cron schedule"
    explanation_zh: "写入 cron 定时任务"
    risk_en: "Cron entries run commands on a schedule, unattended."
    risk_zh: "cron 条目会按计划在无人值守时执行命令。"

  # ── privileged / system ───────────────────────────────────────────────────
  - id: path-sudoers
    category: privilege
    severity: high
    regex: "(^|/)sudoers"
    explanation_en: "Writes a sudoers file"
    explanation_zh: "写入 sudoers 文件"
    risk_en: "sudoers controls who can run commands as root — a change can grant privilege escalation."
    risk_zh: "sudoers 决定谁能以 root 运行命令 —— 改动可能授予提权能力。"

  - id: path-etc
    category: privilege
    severity: medium
    regex: "^/etc/"
    explanation_en: "Writes into /etc (system configuration)"
    explanation_zh: "写入 /etc(系统配置)"
    risk_en: "System-wide config affecting all users; usually needs root and rarely what an edit should touch."
    risk_zh: "影响所有用户的系统级配置;通常需要 root,一般不该被普通编辑触及。"

  # ── content injection (Edit new_string / Write content) ───────────────────
  - id: content-remote-exec
    category: remote-exec
    severity: high
    field: content
    regex: "(curl|wget)\\b[^\\n|]*\\|\\s*(ba)?sh\\b|(^|\\s|;|&)eval\\s"
    explanation_en: "Inserts a download-and-run or eval into the file"
    explanation_zh: "向文件里插入下载即执行或 eval"
    risk_en: "Embedding `curl … | sh` or `eval` in a file makes it run unreviewed remote code when the file is executed."
    risk_zh: "在文件里嵌入 `curl … | sh` 或 `eval`,会在文件被执行时运行未经审查的远程代码。"
